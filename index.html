<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2ede4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171411" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blocks" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Blocks</title>
  </head>
  <body>
    <div id="app">
      <header class="stats-bar" aria-label="Game Stats, Next Piece, and Controls">
        <div class="stat">
          <span class="label">SCORE</span>
          <span id="score-val" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">LEVEL</span>
          <span id="level-val" class="value">1</span>
        </div>
        <div class="stat">
          <span class="label">LINES</span>
          <span id="lines-val" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">4-LINE</span>
          <span id="tetris-val" class="value accent">0</span>
        </div>
        <div class="stat">
          <span class="label">MAX BLK</span>
          <span id="block-val" class="value">0</span>
        </div>
        <div class="next-inline" aria-label="Next Piece">
          <span class="label">NEXT</span>
          <div id="next-stage" class="next-stage"></div>
        </div>
        <div class="hud-actions">
          <button id="fullscreen-btn" class="icon-btn" type="button" aria-label="Toggle Fullscreen">
            ⛶
          </button>
          <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause or Resume">
            II
          </button>
        </div>
      </header>

      <div class="play-area">
        <main class="board-wrap">
          <div id="game-stage" class="game-stage"></div>
          <div id="overlay" class="overlay hidden" role="dialog" aria-live="polite">
            <div class="pause-zones" aria-hidden="true">
              <div class="pause-zone zone-left">
                <div class="zone-badge">
                  <span class="zone-icon">◀</span>
                  <span class="zone-label">LEFT</span>
                </div>
              </div>
              <div class="pause-zone zone-right">
                <div class="zone-badge">
                  <span class="zone-icon">▶</span>
                  <span class="zone-label">RIGHT</span>
                </div>
              </div>
              <div class="pause-zone-gap"></div>
              <div class="pause-zone zone-rotate">
                <div class="zone-badge">
                  <span class="zone-icon">↻</span>
                  <span class="zone-label">ROTATE</span>
                </div>
              </div>
              <div class="pause-zone zone-drop">
                <div class="zone-badge">
                  <span class="zone-icon">▼</span>
                  <span class="zone-label">DROP</span>
                </div>
              </div>
            </div>
            <div class="overlay-card">
              <h2 id="overlay-title">PAUSED</h2>
              <p id="overlay-sub">Tap or press Space to continue</p>
              <button id="overlay-btn" class="primary-btn" type="button">RESUME</button>
            </div>
          </div>
        </main>

        <div class="controls" aria-label="Touch Controls">
          <button id="btn-left" class="ctrl-btn" type="button" aria-label="Move Left"></button>
          <button id="btn-right" class="ctrl-btn" type="button" aria-label="Move Right"></button>
          <div class="controls-gap" aria-hidden="true"></div>
          <button id="btn-rotate" class="ctrl-btn" type="button" aria-label="Rotate"></button>
          <button id="btn-down" class="ctrl-btn" type="button" aria-label="Fast Drop"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
